<div>
                <h1>
                                <h1>Categorías</h1>
                </h1>

                <p *ngIf="errorMessage()">
                                {{ errorMessage() }}
                </p>

                <p *ngIf="!errorMessage() && categories().length === 0">
                                No hay categorías registradas.
                </p>

                <table *ngIf="categories().length > 0">
                                <thead>
                                                <tr>
                                                                <th>ID</th>
                                                                <th>Nombre</th>
                                                </tr>
                                </thead>

                                <tbody>
                                                <tr *ngFor="let category of categories()">
                                                                <td>{{ category.id }}</td>
                                                                <td>{{ category.name }}</td>
                                                </tr>
                                </tbody>
                </table>
</div>
